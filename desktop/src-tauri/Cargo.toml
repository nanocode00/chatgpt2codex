[package]
name = "chatgpt2codex-desktop"
version = "0.1.0"
description = "Tauri desktop dashboard for the existing C2C MCP runtime"
authors = ["ChatGPT To Codex contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chatgpt2codex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# F4-D3: Windows Tauri preview only; the installed WinForms/default C2C
# runtime has a different executable and is not part of this instance lock.
# Pin a 1.77.2-compatible 2.x plugin until the project's MSRV is raised.
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "=2.3.2"
winreg = "0.52"
