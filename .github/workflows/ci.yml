name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release bootstrap integration
        run: bash scripts/e2e-release-bootstrap.sh

      - name: Standalone installer unit tests
        run: python3 scripts/test_standalone_installer.py

      - name: Build standalone runtime
        run: npm run build

      - name: Repository/profile auto-reload integration
        run: python3 scripts/e2e-auto-reload-config.py

      - name: Independent runtime integration
        run: python3 scripts/e2e-standalone-runtime.py
