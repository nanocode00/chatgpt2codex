name: Tauri Desktop Smoke

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/tauri-desktop-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Typecheck and build React UI
        run: npm run desktop:build
      - name: Check Rust toolchain
        run: cargo --version
      - name: Check Tauri Rust backend (no installation, no app launch)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
