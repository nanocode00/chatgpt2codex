name: Tauri Desktop Smoke

on:
  pull_request:
    paths:
      - "desktop/**"
      - "src/cli.ts"
      - "src/runtime/instances.ts"
      - "src/runtime/instances.test.ts"
      - "scripts/package-tauri-cli-preview.ps1"
      - "scripts/test-tauri-nsis-isolated.ps1"
      - "scripts/test-windows-cli-lifecycle-isolated.ps1"
      - "scripts/windows-cli-commands.ps1"
      - "scripts/test-windows-cli-commands-isolated.ps1"
      - "scripts/inspect-windows-f4-acceptance.ps1"
      - "scripts/test-windows-f4-native-rollback.ps1"
      - ".github/workflows/tauri-desktop-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Typecheck and build React UI
        run: npm run desktop:build
      - name: Install and build audited C2C Node CLI
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "CLI npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "CLI TypeScript build failed" }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "CLI Typecheck failed" }
      - name: Test native Windows no-tunnel CLI start stop restart and PID ownership
        shell: pwsh
        run: ./scripts/test-windows-cli-lifecycle-isolated.ps1
      - name: F4-D3 isolated Windows opt-in CLI command installer and rollback
        shell: pwsh
        run: ./scripts/test-windows-cli-commands-isolated.ps1
      - name: F4-D1 read-only acceptance report contract
        shell: pwsh
        run: |
          # No live service is required. The report is not saved or uploaded.
          $reportJson = & ./scripts/inspect-windows-f4-acceptance.ps1 -Port 62349
          if (-not $reportJson) { throw "F4-D1 did not return JSON" }
          $report = $reportJson | ConvertFrom-Json -ErrorAction Stop
          if ($report.schemaVersion -ne 1 -or $report.phase -ne "F4-D1" -or
              $report.canTransitionNow -ne $false -or
              $report.observationOnly -ne $true -or
              $report.mayStopProcesses -ne $false -or
              $report.inspectedPort -ne 62349) {
            throw "F4-D1 report must always refuse live cutover"
          }
          $expected = @("loopbackListener", "cliProcessCandidate", "localHealth",
              "osProcessOwnership", "publicOAuthContinuity", "chatgptClientRoundtrip",
              "rollbackReadiness", "featureParity")
          $keys = @($report.checks.PSObject.Properties.Name)
          if ($keys.Count -ne $expected.Count) { throw "F4-D1 checks schema changed" }
          foreach ($key in $expected) {
            if ($key -notin $keys) { throw "F4-D1 check missing" }
          }
          if ($report.checks.osProcessOwnership -ne "unverified" -or
              $report.checks.publicOAuthContinuity -ne "not_tested" -or
              $report.checks.chatgptClientRoundtrip -ne "not_tested" -or
              $report.checks.rollbackReadiness -ne "not_proven" -or
              $report.checks.featureParity -ne "manual_review_required") {
            throw "F4-D1 must not infer manual acceptance from localhost checks"
          }
          Write-Host "PASS F4-D1: bounded redacted read-only no-go report contract"
      - name: F4-C1 real disposable CLI cutover and rollback (no legacy runtime)
        shell: pwsh
        env:
          C2C_F4C1_E2E: "true"
        run: ./scripts/test-windows-f4-native-rollback.ps1
      - name: Create isolated bundled CLI runtime
        shell: pwsh
        run: |
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "CLI runtime pruning failed" }
          ./scripts/package-tauri-cli-preview.ps1
      - name: E2E the actual bundled CLI with its bundled Node executable
        shell: pwsh
        run: |
          ./scripts/test-windows-cli-lifecycle-isolated.ps1 `
            -NodeExecutable "desktop/src-tauri/target/debug/c2c-runtime/bin/node.exe" `
            -CliEntrypoint "desktop/src-tauri/target/debug/c2c-runtime/dist/cli.js"
      - name: Check Rust toolchain
        run: cargo --version
      - name: Unit-test native CLI URL, DPAPI backup and log safety checks
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: F3 disposable DPAPI restore and authenticated MCP E2E
        env:
          C2C_F3_E2E: "true"
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib encrypted_fixture_restores_to_disposable_cli_and_authenticates -- --nocapture
      - name: F4-C synthetic cutover journal and rollback fault injection
        env:
          C2C_F4C_E2E: "true"
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib cutover_transaction_fixture -- --nocapture
      - name: F4-C2 disposable Windows directory handover and crash recovery
        env:
          C2C_F4C2_E2E: "true"
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib cutover_file_fixture -- --nocapture
      - name: Build unsigned Windows desktop preview (no installation)
        run: npm --prefix desktop run tauri:build -- --debug --no-bundle
      - name: Verify Windows GUI subsystem (no console window)
        shell: pwsh
        run: |
          $exePath = (Resolve-Path "desktop/src-tauri/target/debug/chatgpt2codex-desktop.exe").Path
          $bytes = [IO.File]::ReadAllBytes($exePath)
          if ($bytes.Length -lt 256) { throw "Invalid Windows executable" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 96) -gt $bytes.Length) {
            throw "Invalid PE optional header location"
          }
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") {
            throw "Missing PE signature"
          }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "Expected IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $subsystem"
          }
          Write-Host "PASS: native GUI subsystem; debug preview does not allocate a console"
      - name: Publish preview executable for visual review
        uses: actions/upload-artifact@v4
        with:
          name: c2c-tauri-windows-preview
          path: |
            desktop/src-tauri/target/debug/chatgpt2codex-desktop.exe
            desktop/src-tauri/target/debug/c2c-runtime/**
          if-no-files-found: error
          retention-days: 7
      - name: F4-D4-A build separate current-user Tauri NSIS installer
        shell: pwsh
        run: |
          npm --prefix desktop run tauri:build -- --debug --bundles nsis --config src-tauri/tauri.nsis.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri dedicated NSIS bundle build failed" }
          $installers = @(Get-ChildItem "desktop/src-tauri/target/debug/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one isolated NSIS setup.exe" }
          Write-Host "PASS: F4-D4 dedicated current-user installer generated"
      - name: F4-D4-A isolated NSIS install and uninstall E2E
        shell: pwsh
        run: ./scripts/test-tauri-nsis-isolated.ps1
      - name: Publish unsigned isolated NSIS installer for guarded review
        uses: actions/upload-artifact@v4
        with:
          name: c2c-tauri-nsis-isolated-review-only
          path: desktop/src-tauri/target/debug/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3
