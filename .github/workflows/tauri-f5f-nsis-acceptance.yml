name: F5-F3 isolated Tauri NSIS acceptance

on:
  pull_request:
    paths:
      - "scripts/test-tauri-nsis-isolated.ps1"
      - "scripts/test-tauri-nsis-upgrade-isolated.ps1"
      - ".github/workflows/tauri-f5f-nsis-acceptance.yml"
      - "desktop/src-tauri/tauri.nsis.conf.json"
      - "desktop/src-tauri/windows/f4d4-hooks.nsh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f5f-nsis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-acceptance:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "CLI npm ci failed" }
          npm ci --prefix desktop --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Desktop npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }
          npm run desktop:build
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed" }
      - name: Bundle exact isolated CLI runtime
        shell: pwsh
        run: |
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Runtime dependency pruning failed" }
          ./scripts/package-tauri-cli-preview.ps1
      - name: Build separate 0.1.0 NSIS setup
        shell: pwsh
        run: |
          npm --prefix desktop run tauri:build -- --debug --bundles nsis --config src-tauri/tauri.nsis.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Baseline NSIS build failed" }
          $setups = @(Get-ChildItem "desktop/src-tauri/target/debug/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($setups.Count -ne 1) { throw "Expected one baseline NSIS installer" }
          $staging = Join-Path $env:RUNNER_TEMP "c2c-f4d4-nsis-baseline"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination (Join-Path $staging "baseline-setup.exe")
      - name: Fresh install and uninstall on disposable Windows runner
        shell: pwsh
        run: ./scripts/test-tauri-nsis-isolated.ps1
      - name: Build separate 0.1.1 upgrade fixture
        shell: pwsh
        run: |
          $config = Get-Content -LiteralPath "desktop/src-tauri/tauri.nsis.conf.json" -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName version -NotePropertyValue "0.1.1"
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath "desktop/src-tauri/tauri.nsis.upgrade.ci.json" -Encoding utf8
          npm --prefix desktop run tauri:build -- --debug --bundles nsis --config src-tauri/tauri.nsis.upgrade.ci.json
          if ($LASTEXITCODE -ne 0) { throw "Upgrade NSIS build failed" }
          $setups = @(Get-ChildItem "desktop/src-tauri/target/debug/bundle/nsis" -Filter "*-setup.exe" -File | Where-Object { $_.Name -match "0[._]1[._]1" })
          if ($setups.Count -ne 1) { throw "Expected one upgrade NSIS installer" }
          $staging = Join-Path $env:RUNNER_TEMP "c2c-f4d4-nsis-upgrade"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item -LiteralPath $setups[0].FullName -Destination (Join-Path $staging "upgrade-setup.exe")
      - name: Reinstall upgrade checksum refusal and data-retention E2E
        shell: pwsh
        run: ./scripts/test-tauri-nsis-upgrade-isolated.ps1
      - name: Publish unsigned review-only installer fixture
        uses: actions/upload-artifact@v4
        with:
          name: c2c-f5f-nsis-review-only
          path: ${{ runner.temp }}/c2c-f4d4-nsis-baseline/baseline-setup.exe
          if-no-files-found: error
          retention-days: 7
