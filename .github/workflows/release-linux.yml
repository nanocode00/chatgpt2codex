name: Linux Release Package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to upload Linux assets to
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: |
          node - <<'NODE'
          const version = require('./package.json').version;
          const tag = process.env.RELEASE_TAG.replace(/^v/, '');
          if (tag !== version) {
            console.error(`release tag v${tag} does not match package version ${version}`);
            process.exit(1);
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release bootstrap integration
        run: bash scripts/e2e-release-bootstrap.sh

      - name: Build self-contained Linux package
        shell: pwsh
        run: >
          ./scripts/build-linux-installer.ps1
          -OutputRun build/linux/chatgpt2codex-linux-x64.run
          -SkipRootInstall

      - name: Generate checksums
        run: |
          cd build/linux
          sha256sum chatgpt2codex-linux-x64.run > SHA256SUMS

      - name: Smoke release artifact
        run: |
          bash scripts/e2e-linux-installer.sh \
            --installer build/linux/chatgpt2codex-linux-x64.run \
            --skip-tunnel

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt2codex-linux-x64-${{ env.RELEASE_TAG }}
          path: |
            build/linux/chatgpt2codex-linux-x64.run
            build/linux/SHA256SUMS
          if-no-files-found: error

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            build/linux/chatgpt2codex-linux-x64.run \
            build/linux/SHA256SUMS \
            --clobber
